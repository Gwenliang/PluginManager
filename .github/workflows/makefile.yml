name: Build PluginManager

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # macOS runner 自带 Xcode（clang + iOS SDK），绕开 theos 在 Linux 上
    # 需要额外下载交叉工具链的问题，同时支持 arm64e 原生编译
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装依赖 (ldid 与 dpkg-deb)
        run: |
          brew install ldid dpkg

      - name: 安装 theos
        run: |
          sudo git clone --recursive --depth 1 https://github.com/theos/theos.git /opt/theos
          sudo chown -R "$(whoami)" /opt/theos

      - name: 编译
        run: |
          export THEOS=/opt/theos
          make clean
          make package

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: PluginManager
          path: |
            packages/*.deb
            .theos/obj/debug/arm64e/PluginManager.dylib
          if-no-files-found: error
